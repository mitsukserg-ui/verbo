<style>
/* Layout: one-screen phone app — a header strip, one centered card, answers anchored at the bottom. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #17213a;
  --muted: #5d6781;
  --line: #d6dbe7;
  --accent: #c8401e;      /* azulejo red */
  --accent-2: #f2b430;    /* saffron */
  --ok: #1f9d55;
  --ok-bg: #dff5e8;
  --bad: #d83a3a;
  --bad-bg: #fde3e3;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Onest", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #1a2136; --ink: #ecf0fa; --muted: #9aa4bf; --line: #2c3550;
  --accent: #ff7a52; --accent-2: #f5c04d; --ok: #3ccf7f; --ok-bg: #143826; --bad: #ff6b6b; --bad-bg: #4a1d22;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #1a2136; --ink: #ecf0fa; --muted: #9aa4bf; --line: #2c3550;
  --accent: #ff7a52; --accent-2: #f5c04d; --ok: #3ccf7f; --ok-bg: #143826; --bad: #ff6b6b; --bad-bg: #4a1d22;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
.app { min-height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 20px; box-sizing: border-box; gap: 14px; }
button, select { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, a:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
h1, h2, .es { font-family: var(--display); text-wrap: balance; }

/* Home */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.tag { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: var(--radius); background: var(--line); }
.seg button { border: 0; border-radius: 10px; padding: 11px 8px; background: transparent; font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .4s; }
.levels { display: grid; gap: 8px; }
.lvl { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.lvl.on { border-color: var(--accent); }
.lvl .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--line); flex: none; font-variant-numeric: tabular-nums; }
.lvl.on .dot { background: var(--accent); color: #fff; }
.lvl.done .dot { background: var(--ok); color: #fff; }
.lvl div { min-width: 0; }
.lvl b { display: block; font-size: 14px; }
.lvl small { color: var(--muted); font-size: 12px; }
.all-levels summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 2px; }
.all-levels .levels { margin-top: 8px; }
.toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); padding: 2px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.cta { width: 100%; border: 0; border-radius: var(--radius); padding: 16px; font-weight: 700; font-size: 17px; background: var(--accent); color: #fff; }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; font-size: 15px; padding: 13px; }
.done-note { text-align: center; padding: 6px 0 2px; }
.done-note b { color: var(--ok); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px; }

/* Dictionary */
.dict { display: grid; gap: 6px; }
.dict details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.dict summary { display: flex; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; list-style: none; }
.dict summary::-webkit-details-marker { display: none; }
.dict summary .em { font-size: 22px; width: 30px; text-align: center; flex: none; }
.dict summary .es { font-weight: 600; font-size: 17px; }
.dict summary .ua { color: var(--muted); font-size: 13px; min-width: 0; }
.dict .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.dict .more { padding: 0 12px 12px; font-size: 14px; display: grid; gap: 8px; }
.dict select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.ctab { width: 100%; border-collapse: collapse; font-size: 14px; }
.ctab td, .ctab th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ctab th { color: var(--muted); font-weight: 500; font-size: 12px; width: 42%; }
.cue { color: var(--muted); font-size: 13px; }
.wr a { color: var(--accent); }

/* Lesson */
.top { display: flex; align-items: center; gap: 10px; }
.x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; flex: none; }
.top .bar { flex: 1; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.stage { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; text-align: center; }
.card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 18px 8px; min-height: 220px; }
.pic { font-size: 84px; line-height: 1.1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
.word { font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.word.ua { font-family: var(--body); font-weight: 700; font-size: 26px; }
.sub { color: var(--muted); font-size: 15px; }
.pron { display: inline-block; padding: 4px 12px; border-radius: 99px; background: var(--accent-2); color: #2a1d00; font-weight: 700; font-size: 18px; }
.say { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; justify-self: start; }
.opts { display: grid; gap: 10px; }
.opt { width: 100%; text-align: left; padding: 15px 16px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-size: 17px; font-weight: 500; transition: background .15s, border-color .15s, transform .1s; }
.opt:active { transform: scale(.98); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.forms { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
.forms .ft { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.forms .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.forms .fc { display: grid; gap: 1px; min-width: 0; }
.forms .fc span { font-size: 12px; color: var(--muted); }
.forms .fc b { font-family: var(--display); font-size: 18px; overflow-wrap: anywhere; }
.toast { text-align: center; padding: 10px 12px; border-radius: var(--radius); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.typing { display: grid; gap: 10px; }
.inp { width: 100%; box-sizing: border-box; font-family: var(--display); font-size: 26px; text-align: center; padding: 14px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.inp.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.inp.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.keys { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.keys button { min-width: 42px; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; font-family: var(--display); }
.hint { text-align: center; font-size: 15px; color: var(--muted); min-height: 22px; }
.hint b { color: var(--ink); font-family: var(--display); font-size: 19px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-7px) } 40%,80% { transform: translateX(7px) } }
.finish { text-align: center; display: grid; gap: 14px; padding-top: 30px; }
.finish .pic { font-size: 96px; }
.confirm { display: grid; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .bar i, .opt { transition: none; } }
</style>

  const out = { mode: 'verbs', verbs: blank(), nouns: blank(), full: false, sound: true, updated: 0, ...s };
  if (!s.verbs && typeof s.learned === 'number') out.verbs = { learned: s.learned, lastDate: s.lastDate || '', days: s.days || 0 };
  delete out.learned; delete out.lastDate; delete out.days;
  if (!MODES[out.mode]) out.mode = 'verbs';
  return out;
}
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s) state = normalize(s); } catch (e) {} mode = state.mode; }
async function save() {
  state.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (progressRef) { try { await progressRef.set(JSON.parse(JSON.stringify(state))); } catch (e) {} }
}
async function connectDb() {
  try {
    if (STANDALONE || !window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    progressRef = db.doc('data/users/' + id + '/progress');
    const snap = await progressRef.get();
    const remote = snap.exists ? normalize(snap.data()) : null;
    if (remote && (remote.updated || 0) > (state.updated || 0)) {
      state = remote; mode = state.mode;
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      if (view === 'home') renderHome();
    } else if (state.updated && (!remote || (remote.updated || 0) < state.updated)) {
      await progressRef.set(JSON.parse(JSON.stringify(state)));
    }
  } catch (e) { progressRef = null; }
}

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');
let view = 'home';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = 0.9;
    const es = speechSynthesis.getVoices().find(v => v.lang === 'es-ES') || speechSynthesis.getVoices().find(v => v.lang.startsWith('es'));
    if (es) u.voice = es;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} };

// Sounds are synthesized with Web Audio, so the app needs no audio files and works offline.
let audioCtx = null;
function tone(notes) {
  if (state.sound === false) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + 0.02;
    for (const [freq, start, dur, type = 'sine', vol = 0.2] of notes) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + start);
      g.gain.exponentialRampToValueAtTime(vol, t0 + start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
    }
  } catch (e) {}
}
const soundOk = () => tone([[880, 0, 0.12], [1318.5, 0.09, 0.22]]);
const soundFanfare = () => tone([[523.25, 0, 0.2, 'triangle'], [659.25, 0.15, 0.2, 'triangle'], [783.99, 0.3, 0.2, 'triangle'], [1046.5, 0.45, 0.6, 'triangle', 0.25], [1318.5, 0.45, 0.6, 'sine', 0.12]]);

/* ---------- Lesson engine ---------- */
let lesson = null;

function mcTask(i) { return { type: 'mc', i }; }
function verbStages(newIdx) {
  const stages = [];
  // Newest tense first with every person, then a recap of the older tenses.
  const byTense = new Map();
  for (const i of newIdx) {
    const open = tensesFor(i);
    if (!open.length) continue;
    const newest = unlockAt(TENSES.indexOf(open[open.length - 1]));
    for (const t of open) {
      const isNew = unlockAt(TENSES.indexOf(t)) === newest;
      const ks = isNew || state.full ? persons(t.k) : [pick(persons(t.k))];
      if (!byTense.has(t.k)) byTense.set(t.k, { t, isNew, tasks: [] });
      byTense.get(t.k).tasks.push(...ks.map(k => ({ type: 'conj', i, k, tense: t.k })));
    }
  }
  const groups = [...byTense.values()].sort((a, b) => (b.isNew - a.isNew) || (TENSES.indexOf(a.t) - TENSES.indexOf(b.t)));
  for (const g of groups) stages.push({ name: `${g.isNew ? '' : 'Повтор · '}${g.t.ua} · ${g.t.es}`, tasks: g.tasks });
  return stages;
}
function nounStages(newIdx) {
  const stages = [];
  const pl = newIdx.filter(i => i >= 100 && NOUNS[i].pl);
  if (pl.length) stages.push({ name: 'Множина з артиклем · los / las', tasks: shuffle(pl).map(i => ({ type: 'form', i, f: 'pl' })) });
  const un = newIdx.filter(i => i >= 200);
  if (un.length) stages.push({ name: 'Неозначений артикль · un / una', tasks: shuffle(un.flatMap(i => NOUNS[i].unos ? [{ type: 'form', i, f: 'un' }, { type: 'form', i, f: 'unos' }] : [{ type: 'form', i, f: 'un' }])) });
  return stages;
}
// Every lesson (the daily one and any extra one) ends with all earlier words as multiple choice.
function buildLesson() {
  const start = P().learned, end = Math.min(N(), start + PER_DAY);
  const newIdx = []; for (let i = start; i < end; i++) newIdx.push(i);
  const stages = [];
  stages.push({ name: `Нові ${mode === 'verbs' ? 'дієслова' : 'іменники'} · обери переклад`, tasks: newIdx.map(mcTask) });
  stages.push({ name: mode === 'verbs' ? 'Напиши іспанською' : 'Напиши іспанською з артиклем', tasks: shuffle(newIdx).map(i => ({ type: 'spell', i })) });
  stages.push(...(mode === 'verbs' ? verbStages(newIdx) : nounStages(newIdx)));
  if (start > 0) {
    const old = []; for (let i = 0; i < start; i++) old.push(i);
    stages.push({ name: `Повторення всіх вивчених слів (${start})`, review: true, tasks: shuffle(old).map(mcTask) });
  }
  return { stages, newIdx, start, end, commit: true, mode };
}
function startLesson() { lesson = buildLesson(); lesson.s = 0; lesson.t = 0; saveLesson(); renderTask(); }

// The lesson in progress is kept per profile and section, so closing the app mid-review loses nothing.
const lessonKey = () => LS_KEY + ':lesson:' + mode;
function saveLesson() { if (lesson && lesson.commit) try { localStorage.setItem(lessonKey(), JSON.stringify(lesson)); } catch (e) {} }
function clearLesson() { try { localStorage.removeItem(lessonKey()); } catch (e) {} }
function loadLesson() {
  try {
    const l = JSON.parse(localStorage.getItem(lessonKey()));
    return l && l.mode === mode && l.start === P().learned && l.stages && l.s < l.stages.length ? l : null;
  } catch (e) { return null; }
}
function startReview() {
  const all = []; for (let i = 0; i < P().learned; i++) all.push(i);
  lesson = { stages: [{ name: 'Повторення', tasks: shuffle(all).map(mcTask) }], commit: false, s: 0, t: 0 };
  renderTask();
}

function progressInfo() {
  const total = lesson.stages.reduce((n, s) => n + s.tasks.length, 0);
  const done = lesson.stages.slice(0, lesson.s).reduce((n, s) => n + s.tasks.length, 0) + lesson.t;
  return { total, done };
}
function header() {
  const { total, done } = progressInfo();
  const toast = lesson.toast ? `<div class="toast" role="status">${lesson.toast}</div>` : '';
  lesson.toast = '';
  return `<div class="top"><button class="x" id="quit" aria-label="Вийти">✕</button><div class="bar"><i style="width:${done / total * 100}%"></i></div><span class="count">${done}/${total}</span></div>
    ${toast}<div class="stage">${lesson.stages[lesson.s].name}</div>`;
}
function next() {
  lesson.t++;
  if (lesson.t >= lesson.stages[lesson.s].tasks.length) {
    lesson.s++; lesson.t = 0;
    // The day's new words are done once the lesson reaches the review of earlier words.
    if (lesson.commit && lesson.stages[lesson.s] && lesson.stages[lesson.s].review) {
      soundFanfare();
      lesson.toast = `🎉 ${lesson.end - lesson.start} нових слів пройдено! Тепер повторення.`;
    }
  }
  if (lesson.s >= lesson.stages.length) return finishLesson();
  saveLesson();
  renderTask();
}
function bindQuit() { document.getElementById('quit').onclick = () => { lesson = null; renderHome(); }; }

function renderTask() {
  view = 'lesson';
  const task = lesson.stages[lesson.s].tasks[lesson.t];
  if (task.type === 'mc') renderMC(task); else renderType(task);
}

function distractors(i) {
  const list = LIST(), right = list[i].ua, seen = new Set([right]), out = [];
  const pool = shuffle(list.map((_, k) => k).filter(k => k !== i));
  for (const k of pool) { const u = list[k].ua; if (!seen.has(u)) { seen.add(u); out.push(u); } if (out.length === 3) break; }
  return out;
}
// All forms of the word, shown under it after the right translation is picked.
function formsHtml(v) {
  const cell = (label, form) => `<div class="fc"><span>${label}</span><b>${esc(show(form))}</b></div>`;
  if (mode === 'nouns') {
    return `<div class="forms"><div class="ft">Форми з артиклем</div><div class="fg">
      ${cell('однина', v.es)}${cell('множина', v.pl || '—')}
      ${cell('неозначений', v.un)}${cell('неозначений, мн.', v.unos || '—')}</div></div>`;
  }
  const c = conjugate(v.es, v.fl);
  return `<div class="forms"><div class="ft">Теперішній час · presente</div><div class="fg">
    ${[0, 3, 1, 4, 2, 5].map(k => cell(PRONOUNS[k], c.p[k])).join('')}</div></div>`;
}
function renderMC(task) {
  const v = LIST()[task.i];
  let options = shuffle([v.ua, ...distractors(task.i)]);
  $app.innerHTML = header() + `
    <div class="card"><div class="pic">${v.em}</div><div class="word es">${esc(v.es)}</div><button class="say" id="say">🔊 Послухати</button></div>
    <div class="opts" id="opts"></div>`;
  bindQuit();
  document.getElementById('say').onclick = () => speak(v.es);
  let locked = false;
  const draw = () => {
    const box = document.getElementById('opts');
    box.innerHTML = options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join('');
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (locked) return;
      locked = true;
      const choice = options[+b.dataset.k];
      if (choice === v.ua) {
        b.classList.add('ok'); soundOk(); speak(v.es);
        setTimeout(() => {
          box.innerHTML = `<button class="opt ok" disabled>${esc(v.ua)}</button>${formsHtml(v)}<button class="cta" id="next-btn">Далі →</button>`;
          const nb = document.getElementById('next-btn');
          nb.onclick = next; nb.focus();
        }, 350);
      } else {
        b.classList.add('bad'); buzz();
        setTimeout(() => { options = shuffle(options); locked = false; draw(); }, 800);
      }
    });
  };
  draw();
}

const FORM_LABEL = { pl: ['множина', 'los / las + …'], un: ['неозначений артикль', 'un / una + …'], unos: ['неозначений, множина', 'unos / unas + …'] };
function renderType(task) {
  const v = LIST()[task.i];
  let answer, prompt;
  if (task.type === 'spell') {
    answer = v.es;
    const hint = mode === 'nouns' ? `Напиши з артиклем (el / la) · ${v.word.length} літер` : `Напиши це дієслово іспанською · ${answer.length} літер`;
    prompt = `<div class="pic">${v.em}</div><div class="word ua">${esc(v.ua)}</div><div class="sub">${hint}</div>`;
  } else if (task.type === 'form') {
    answer = v[task.f];
    const [ua, pattern] = FORM_LABEL[task.f];
    prompt = `<div class="pic" style="font-size:56px">${v.em}</div>
      <div class="word es" style="font-size:30px">${esc(v.es)}</div><div class="sub">${esc(v.ua)}</div>
      <div class="pron">${pattern}</div><div class="sub">${ua}</div>`;
  } else {
    const t = TENSES.find(x => x.k === task.tense);
    answer = conjugate(v.es, v.fl)[task.tense][task.k];
    prompt = `<div class="pic" style="font-size:56px">${v.em}</div>
      <div class="word es" style="font-size:30px">${esc(v.es)}</div><div class="sub">${esc(v.ua)}</div>
      <div class="sub"><b>${t.ua}</b> · ${t.es} · <i>${esc(t.cue)}</i></div>
      <div class="pron">${pronLabel(task.tense, task.k)}</div><div class="sub">${pronUa(task.tense, task.k)}</div>`;
  }
  const accepted = alts(answer).map(norm);
  $app.innerHTML = header() + `
    <div class="card">${prompt}</div>
    <form class="typing" id="f" autocomplete="off">
      <input class="inp" id="answer" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="escribe aquí…" aria-label="Відповідь">
      <div class="keys">${['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü'].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>
      <div class="hint" id="hint"></div>
      <button class="cta" type="submit">Перевірити</button>
    </form>`;
  bindQuit();
  const inp = document.getElementById('answer'), hint = document.getElementById('hint');
  let fails = 0, locked = false;
  inp.focus();
  document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0, s) + b.dataset.key + inp.value.slice(e);
    inp.focus(); inp.setSelectionRange(s + 1, s + 1); inp.classList.remove('bad');
  });
  inp.oninput = () => inp.classList.remove('bad');
  document.getElementById('f').onsubmit = ev => {
    ev.preventDefault();
    if (locked || !inp.value.trim()) return;
    const given = norm(inp.value);
    if (accepted.includes(given)) {
      locked = true; inp.classList.add('ok'); soundOk(); speak(given);
      setTimeout(next, 800);
    } else {
      fails++; buzz();
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('bad', 'shake');
      const noAccents = s => s.normalize('NFD').replace(/[́̈]/g, '');
      const bare = s => s.replace(/^(el|la|los|las|un|una|unos|unas) /, '');
      if (accepted.some(a => noAccents(a) === noAccents(given))) hint.textContent = 'Майже! Перевір наголоси (á é í ó ú ñ ü).';
      else if (mode === 'nouns' && accepted.some(a => bare(a) === given)) hint.textContent = 'Слово правильне, а де артикль?';
      else if (mode === 'nouns' && accepted.some(a => bare(a) === bare(given))) hint.textContent = 'Слово правильне, але артикль інший.';
      else if (fails >= 2) hint.innerHTML = `Правильно: <b>${esc(show(answer))}</b> — введи ще раз`;
      else hint.textContent = 'Неправильно, спробуй ще раз.';
      inp.select();
    }
  };
}

async function finishLesson() {
  const wasLesson = lesson.commit, pr = P();
  let learnedNow = 0;
  const before = pr.learned;
  soundFanfare();
  if (wasLesson) {
    clearLesson();
    learnedNow = lesson.end - pr.learned;
    pr.learned = lesson.end;
    if (pr.lastDate !== today()) { pr.days++; pr.lastDate = today(); }
    await save();
  }
  const reviewed = lesson.stages.reduce((n, s) => n + s.tasks.length, 0);
  const lvOf = M().levelOf;
  const newLevel = wasLesson && pr.learned < N() && lvOf(pr.learned) > lvOf(before) ? M().levels[lvOf(pr.learned) - 1] : null;
  const newSteps = wasLesson ? openSteps(pr.learned).filter(t => !openSteps(before).includes(t)) : [];
  view = 'finish';
  $app.innerHTML = `<div class="finish">
    <div class="pic">🎉</div>
    <h2 style="margin:0;font-size:30px">¡Muy bien!</h2>
    <div class="sub">${wasLesson ? `Нових слів: <b>${learnedNow}</b> · Усього вивчено: <b>${pr.learned}</b>` : `Повторено слів: <b>${reviewed}</b>`}</div>
    ${newLevel ? `<div class="panel">Новий рівень: <b>${newLevel.title}</b></div>` : ''}
    ${newSteps.length ? `<div class="panel">Відкрито: <b>${newSteps.join(', ')}</b>. З наступного уроку нові слова тренуються ще й у цій формі.</div>` : ''}
    <button class="cta" id="home">На головну</button></div>`;
  document.getElementById('home').onclick = () => { lesson = null; renderHome(); };
}

if (STANDALONE) {
  let saved = '';
  try { saved = localStorage.getItem(CURRENT_KEY) || ''; } catch (e) {}
  if (saved) { useProfile(saved); renderHome(); } else renderLogin();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
} else {
  loadLocal();
  renderHome();
  connectDb();
}
