<style>
/* Layout: one-screen phone app — a header strip, one centered card, answers anchored at the bottom. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #17213a;
  --muted: #5d6781;
  --line: #d6dbe7;
  --accent: #c8401e;      /* azulejo red */
  --accent-2: #f2b430;    /* saffron */
  --ok: #1f9d55;
  --ok-bg: #dff5e8;
  --bad: #d83a3a;
  --bad-bg: #fde3e3;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Onest", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #1a2136; --ink: #ecf0fa; --muted: #9aa4bf; --line: #2c3550;
  --accent: #ff7a52; --accent-2: #f5c04d; --ok: #3ccf7f; --ok-bg: #143826; --bad: #ff6b6b; --bad-bg: #4a1d22;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #1a2136; --ink: #ecf0fa; --muted: #9aa4bf; --line: #2c3550;
  --accent: #ff7a52; --accent-2: #f5c04d; --ok: #3ccf7f; --ok-bg: #143826; --bad: #ff6b6b; --bad-bg: #4a1d22;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
.app { min-height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 20px; box-sizing: border-box; gap: 14px; }
button, select { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, a:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
h1, h2, .es { font-family: var(--display); text-wrap: balance; }

/* Home */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.tag { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ex-sentence { font-family: var(--display); font-size: 21px; line-height: 1.5; }
.ex-context { display: grid; gap: 6px; color: var(--muted); font-size: 15px; line-height: 1.45; }
.ex-context p { margin: 0; }
.gap { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--accent-2); color: #2a1d00; font-weight: 700; white-space: nowrap; }
.filled { color: var(--ok); }
.ex-ua { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-family: var(--body); font-size: 16px; line-height: 1.4; color: var(--muted); }
.ex-ua::before { content: "Переклад: "; font-weight: 700; color: var(--ink); }
.ex-ua-small { font-size: 13px; color: var(--muted); }
.examples { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
.examples .ft { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.examples p { margin: 0; font-size: 15px; line-height: 1.4; }
.ex-hint { font-size: 14px; color: var(--muted); margin-bottom: -4px; }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 0 6px; font-family: var(--display); font-weight: 800; font-size: 17px; display: grid; gap: 1px; }
.chip small { font-family: var(--body); font-weight: 500; font-size: 10px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.chip[aria-pressed="true"] small { color: #fff; opacity: .85; }
.gtimer i { background: linear-gradient(90deg, var(--bad), var(--accent-2)); }
.opt.es { font-family: var(--display); font-size: 19px; }
.gtab td, .gtab th { font-size: 15px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: var(--radius); background: var(--line); }
.seg button { border: 0; border-radius: 10px; padding: 11px 2px; background: transparent; font-weight: 700; font-size: 14px; color: var(--muted); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .4s; }
.levels { display: grid; gap: 8px; }
.lvl { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.lvl.on { border-color: var(--accent); }
.lvl .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--line); flex: none; font-variant-numeric: tabular-nums; }
.lvl.on .dot { background: var(--accent); color: #fff; }
.lvl.done .dot { background: var(--ok); color: #fff; }
.lvl div { min-width: 0; }
.lvl b { display: block; font-size: 14px; }
.lvl small { color: var(--muted); font-size: 12px; }
.all-levels summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 2px; }
.all-levels .levels { margin-top: 8px; }
.toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); padding: 2px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.cta { width: 100%; border: 0; border-radius: var(--radius); padding: 16px; font-weight: 700; font-size: 17px; background: var(--accent); color: #fff; }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; font-size: 15px; padding: 13px; }
.done-note { text-align: center; padding: 6px 0 2px; }
.done-note b { color: var(--ok); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px; }

/* Dictionary */
.dict { display: grid; gap: 6px; }
.dict details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.dict summary { display: flex; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; list-style: none; }
.dict summary::-webkit-details-marker { display: none; }
.dict summary .em { font-size: 22px; width: 30px; text-align: center; flex: none; }
.dict summary .es { font-weight: 600; font-size: 17px; }
.dict summary .ua { color: var(--muted); font-size: 13px; min-width: 0; }
.dict .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.dict .more { padding: 0 12px 12px; font-size: 14px; display: grid; gap: 8px; }
.dict select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.ctab { width: 100%; border-collapse: collapse; font-size: 14px; }
.ctab td, .ctab th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ctab th { color: var(--muted); font-weight: 500; font-size: 12px; width: 42%; }
.cue { color: var(--muted); font-size: 13px; }
.wr a { color: var(--accent); }

/* Lesson */
.top { display: flex; align-items: center; gap: 10px; }
.x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; flex: none; }
.top .bar { flex: 1; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.stage { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; text-align: center; }
.card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 18px 8px; min-height: 220px; }
.pic { font-size: 84px; line-height: 1.1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
.svgpic { display: inline-block; vertical-align: middle; }
.svgpic svg { width: 100%; height: 100%; display: block; }
.word { font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.word.ua { font-family: var(--body); font-weight: 700; font-size: 26px; }
.sub { color: var(--muted); font-size: 15px; }
.pron { display: inline-block; padding: 4px 12px; border-radius: 99px; background: var(--accent-2); color: #2a1d00; font-weight: 700; font-size: 18px; }
.say { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; justify-self: start; }
.opts { display: grid; gap: 10px; }
.opt { width: 100%; text-align: left; padding: 15px 16px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-size: 17px; font-weight: 500; transition: background .15s, border-color .15s, transform .1s; }
.opt:active { transform: scale(.98); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.forms { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
.forms .ft { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.forms .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.forms .fc { display: grid; gap: 1px; min-width: 0; }
.forms .fc span { font-size: 12px; color: var(--muted); }
.forms .fc b { font-family: var(--display); font-size: 18px; overflow-wrap: anywhere; }
.toast { text-align: center; padding: 10px 12px; border-radius: var(--radius); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.typing { display: grid; gap: 10px; }
.inp { width: 100%; box-sizing: border-box; font-family: var(--display); font-size: 26px; text-align: center; padding: 14px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.inp.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.inp.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.keys { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.keys button { min-width: 42px; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; font-family: var(--display); }
.hint { text-align: center; font-size: 15px; color: var(--muted); min-height: 22px; }
.hint b { color: var(--ink); font-family: var(--display); font-size: 19px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-7px) } 40%,80% { transform: translateX(7px) } }
.finish { text-align: center; display: grid; gap: 14px; padding-top: 30px; }
.finish .pic { font-size: 96px; }
.confirm { display: grid; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .bar i, .opt { transition: none; } }
</style>

  return out.sort((a, b) => a.localeCompare(b));
}
function useProfile(name) {
  nick = name; LS_KEY = USER_PREFIX + name;
  state = { mode: 'verbs', verbs: blank(), nouns: blank(), ex: { done: 0, lastDate: '' }, full: false, updated: 0 };
  try { localStorage.setItem(CURRENT_KEY, name); } catch (e) {}
  loadLocal();
  try { if (!localStorage.getItem(LS_KEY)) localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function normalize(s) {
  const out = { mode: 'verbs', verbs: blank(), nouns: blank(), full: false, sound: true, updated: 0, ...s };
  if (!s.verbs && typeof s.learned === 'number') out.verbs = { learned: s.learned, lastDate: s.lastDate || '', days: s.days || 0 };
  delete out.learned; delete out.lastDate; delete out.days;
  if (!MODES[out.mode] && out.mode !== 'ex' && out.mode !== 'game') out.mode = 'verbs';
  out.ex = { done: 0, lastDate: '', ...(s.ex || {}) };

}
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s) state = normalize(s); } catch (e) {} mode = state.mode; }
async function save() {
  state.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (progressRef) { try { await progressRef.set(JSON.parse(JSON.stringify(state))); } catch (e) {} }
}
async function connectDb() {
  try {
    if (STANDALONE || !window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    progressRef = db.doc('data/users/' + id + '/progress');
    const snap = await progressRef.get();
    const remote = snap.exists ? normalize(snap.data()) : null;
    if (remote && (remote.updated || 0) > (state.updated || 0)) {
      state = remote; mode = state.mode;
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      if (view === 'home') renderHome();
    } else if (state.updated && (!remote || (remote.updated || 0) < state.updated)) {
      await progressRef.set(JSON.parse(JSON.stringify(state)));
    }

}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

    const es = speechSynthesis.getVoices().find(v => v.lang === 'es-ES') || speechSynthesis.getVoices().find(v => v.lang.startsWith('es'));
    if (es) u.voice = es;

// Pictures made of 2-3 emoji get smaller so the whole scene fits a phone screen.
function picSize(em, base) {

  try { n = [...new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(em)].length; } catch (e) { n = Math.max(1, Math.round([...em].length / 2)); }
  return n <= 1 ? base : Math.round(base * (n === 2 ? 0.8 : 0.62));
}

function picHtml(em, size, inline) {

const buzz = () => { try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} };

// Sounds are synthesized with Web Audio, so the app needs no audio files and works offline.
let audioCtx = null;
function tone(notes) {
  if (state.sound === false) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + 0.02;
    for (const [freq, start, dur, type = 'sine', vol = 0.2] of notes) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + start);
      g.gain.exponentialRampToValueAtTime(vol, t0 + start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
    }
  } catch (e) {}
}

const soundFanfare = () => tone([[523.25, 0, 0.2, 'triangle'], [659.25, 0.15, 0.2, 'triangle'], [783.99, 0.3, 0.2, 'triangle'], [1046.5, 0.45, 0.6, 'triangle', 0.25], [1318.5, 0.45, 0.6, 'sine', 0.12]]);

/* ---------- Lesson engine ---------- */
let lesson = null;

function mcTask(i) { return { type: 'mc', i }; }
function verbStages(newIdx) {
  const stages = [];
  // Newest tense first with every person, then a recap of the older tenses.
  const byTense = new Map();
  for (const i of newIdx) {
    const open = tensesFor(i);
    if (!open.length) continue;
    const newest = unlockAt(TENSES.indexOf(open[open.length - 1]));
    for (const t of open) {
      const isNew = unlockAt(TENSES.indexOf(t)) === newest;
      const ks = isNew || state.full ? persons(t.k) : [pick(persons(t.k))];
      if (!byTense.has(t.k)) byTense.set(t.k, { t, isNew, tasks: [] });
      byTense.get(t.k).tasks.push(...ks.map(k => ({ type: 'conj', i, k, tense: t.k })));
    }
  }
  const groups = [...byTense.values()].sort((a, b) => (b.isNew - a.isNew) || (TENSES.indexOf(a.t) - TENSES.indexOf(b.t)));
  for (const g of groups) stages.push({ name: `${g.isNew ? '' : 'Повтор · '}${g.t.ua} · ${g.t.es}`, tasks: g.tasks });
  return stages;
}
function nounStages(newIdx) {
  const stages = [];
  const pl = newIdx.filter(i => i >= 100 && NOUNS[i].pl);
  if (pl.length) stages.push({ name: 'Множина з артиклем · los / las', tasks: shuffle(pl).map(i => ({ type: 'form', i, f: 'pl' })) });
  const un = newIdx.filter(i => i >= 200);
  if (un.length) stages.push({ name: 'Неозначений артикль · un / una', tasks: shuffle(un.flatMap(i => NOUNS[i].unos ? [{ type: 'form', i, f: 'un' }, { type: 'form', i, f: 'unos' }] : [{ type: 'form', i, f: 'un' }])) });
  return stages;
}
// Every lesson (the daily one and any extra one) ends with all earlier words as multiple choice.
function buildLesson() {
  const start = P().learned, end = Math.min(N(), start + PER_DAY);
  const newIdx = []; for (let i = start; i < end; i++) newIdx.push(i);
  const stages = [];
  stages.push({ name: `Нові ${mode === 'verbs' ? 'дієслова' : 'іменники'} · обери переклад`, tasks: newIdx.map(mcTask) });
  stages.push({ name: mode === 'verbs' ? 'Напиши іспанською' : 'Напиши іспанською з артиклем', tasks: shuffle(newIdx).map(i => ({ type: 'spell', i })) });
  stages.push(...(mode === 'verbs' ? verbStages(newIdx) : nounStages(newIdx)));
  if (start > 0) {
    const old = []; for (let i = 0; i < start; i++) old.push(i);
    stages.push({ name: `Повторення всіх вивчених слів (${start})`, review: true, tasks: shuffle(old).map(mcTask) });
  }
  return { stages, newIdx, start, end, commit: true, mode };
}
function startLesson() { lesson = buildLesson(); lesson.s = 0; lesson.t = 0; saveLesson(); renderTask(); }

// The lesson in progress is kept per profile and section, so closing the app mid-review loses nothing.
const lessonKey = () => LS_KEY + ':lesson:' + mode;
function saveLesson() { if (lesson && lesson.commit) try { localStorage.setItem(lessonKey(), JSON.stringify(lesson)); } catch (e) {} }
function clearLesson() { try { localStorage.removeItem(lessonKey()); } catch (e) {} }
function loadLesson() {
  try {
    const l = JSON.parse(localStorage.getItem(lessonKey()));
    return l && l.mode === mode && l.start === P().learned && l.stages && l.s < l.stages.length ? l : null;
  } catch (e) { return null; }
}
function startReview() {
  const all = []; for (let i = 0; i < P().learned; i++) all.push(i);
  lesson = { stages: [{ name: 'Повторення', tasks: shuffle(all).map(mcTask) }], commit: false, s: 0, t: 0 };
  renderTask();
}

function progressInfo() {
  const total = lesson.stages.reduce((n, s) => n + s.tasks.length, 0);
  const done = lesson.stages.slice(0, lesson.s).reduce((n, s) => n + s.tasks.length, 0) + lesson.t;
  return { total, done };
}
function header() {
  const { total, done } = progressInfo();
  const toast = lesson.toast ? `<div class="toast" role="status">${lesson.toast}</div>` : '';
  lesson.toast = '';
  return `<div class="top"><button class="x" id="quit" aria-label="Вийти">✕</button><div class="bar"><i style="width:${done / total * 100}%"></i></div><span class="count">${done}/${total}</span></div>
    ${toast}<div class="stage">${lesson.stages[lesson.s].name}</div>`;
}
function next() {
  lesson.t++;
  if (lesson.t >= lesson.stages[lesson.s].tasks.length) {
    lesson.s++; lesson.t = 0;
    // The day's new words are done once the lesson reaches the review of earlier words.
    if (lesson.commit && lesson.stages[lesson.s] && lesson.stages[lesson.s].review) {
      soundFanfare();
      lesson.toast = `🎉 ${lesson.end - lesson.start} нових слів пройдено! Тепер повторення.`;
    }
  }
  if (lesson.s >= lesson.stages.length) return finishLesson();
  saveLesson();
  renderTask();
}
function bindQuit() { document.getElementById('quit').onclick = () => { lesson = null; renderHome(); }; }

function renderTask() {
  view = 'lesson';
  const task = lesson.stages[lesson.s].tasks[lesson.t];
  if (task.type === 'mc') renderMC(task); else renderType(task);
}

function distractors(i) {
  const list = LIST(), right = list[i].ua, seen = new Set([right]), out = [];
  const pool = shuffle(list.map((_, k) => k).filter(k => k !== i));
  for (const k of pool) { const u = list[k].ua; if (!seen.has(u)) { seen.add(u); out.push(u); } if (out.length === 3) break; }
  return out;
}
// All forms of the word, shown under it after the right translation is picked.
function formsHtml(v) {
  const cell = (label, form) => `<div class="fc"><span>${label}</span><b>${esc(show(form))}</b></div>`;
  if (mode === 'nouns') {
    return `<div class="forms"><div class="ft">Форми з артиклем</div><div class="fg">
      ${cell('однина', v.es)}${cell('множина', v.pl || '—')}
      ${cell('неозначений', v.un)}${cell('неозначений, мн.', v.unos || '—')}</div></div>`;
  }
  const c = conjugate(v.es, v.fl);
  return `<div class="forms"><div class="ft">Теперішній час · presente</div><div class="fg">
    ${[0, 3, 1, 4, 2, 5].map(k => cell(PRONOUNS[k], c.p[k])).join('')}</div></div>`;
}
function renderMC(task) {
  const v = LIST()[task.i];
  let options = shuffle([v.ua, ...distractors(task.i)]);
  $app.innerHTML = header() + `
    <div class="card">${picHtml(v.em, 84)}<div class="word es">${esc(v.es)}</div><button class="say" id="say">🔊 Послухати</button></div>
    <div class="opts" id="opts"></div>`;
  bindQuit();
  document.getElementById('say').onclick = () => speak(v.es);
  let locked = false;
  const draw = () => {
    const box = document.getElementById('opts');
    box.innerHTML = options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join('');
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (locked) return;
      locked = true;
      const choice = options[+b.dataset.k];
      if (choice === v.ua) {
        b.classList.add('ok'); soundOk(); speak(v.es);
        setTimeout(() => {
          box.innerHTML = `<button class="opt ok" disabled>${esc(v.ua)}</button>${formsHtml(v)}<button class="cta" id="next-btn">Далі →</button>`;
          const nb = document.getElementById('next-btn');
          nb.onclick = next; nb.focus();
        }, 350);
      } else {
        b.classList.add('bad'); buzz();
        setTimeout(() => { options = shuffle(options); locked = false; draw(); }, 800);
      }
    });
  };
  draw();
}

const FORM_LABEL = { pl: ['множина', 'los / las + …'], un: ['неозначений артикль', 'un / una + …'], unos: ['неозначений, множина', 'unos / unas + …'] };
function renderType(task) {
  const v = LIST()[task.i];
  let answer, prompt;
  if (task.type === 'spell') {
    answer = v.es;
    const hint = mode === 'nouns' ? `Напиши з артиклем (el / la) · ${v.word.length} літер` : `Напиши це дієслово іспанською · ${answer.length} літер`;
    prompt = `${picHtml(v.em, 84)}<div class="word ua">${esc(v.ua)}</div><div class="sub">${hint}</div>`;
  } else if (task.type === 'form') {
    answer = v[task.f];
    const [ua, pattern] = FORM_LABEL[task.f];
    prompt = `${picHtml(v.em, 56)}
      <div class="word es" style="font-size:30px">${esc(v.es)}</div><div class="sub">${esc(v.ua)}</div>
      <div class="pron">${pattern}</div><div class="sub">${ua}</div>`;
  } else {
    const t = TENSES.find(x => x.k === task.tense);
    answer = conjugate(v.es, v.fl)[task.tense][task.k];
    prompt = `${picHtml(v.em, 56)}
      <div class="word es" style="font-size:30px">${esc(v.es)}</div><div class="sub">${esc(v.ua)}</div>
      <div class="sub"><b>${t.ua}</b> · ${t.es} · <i>${esc(t.cue)}</i></div>
      <div class="pron">${pronLabel(task.tense, task.k)}</div><div class="sub">${pronUa(task.tense, task.k)}</div>`;
  }
  const accepted = alts(answer).map(norm);
  $app.innerHTML = header() + `
    <div class="card">${prompt}</div>
    <form class="typing" id="f" autocomplete="off">
      <input class="inp" id="answer" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="escribe aquí…" aria-label="Відповідь">
      <div class="keys">${['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü'].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>
      <div class="hint" id="hint"></div>
      <button class="cta" type="submit">Перевірити</button>
    </form>`;
  bindQuit();
  const inp = document.getElementById('answer'), hint = document.getElementById('hint');
  let fails = 0, locked = false;
  inp.focus();
  document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0, s) + b.dataset.key + inp.value.slice(e);
    inp.focus(); inp.setSelectionRange(s + 1, s + 1); inp.classList.remove('bad');
  });
  inp.oninput = () => inp.classList.remove('bad');
  document.getElementById('f').onsubmit = ev => {
    ev.preventDefault();
    if (locked || !inp.value.trim()) return;
    const given = norm(inp.value);
    if (accepted.includes(given)) {
      locked = true; inp.classList.add('ok'); soundOk(); speak(given);
      setTimeout(next, 800);
    } else {
      fails++; buzz();
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('bad', 'shake');
      const noAccents = s => s.normalize('NFD').replace(/[́̈]/g, '');
      const bare = s => s.replace(/^(el|la|los|las|un|una|unos|unas) /, '');
      if (accepted.some(a => noAccents(a) === noAccents(given))) hint.textContent = 'Майже! Перевір наголоси (á é í ó ú ñ ü).';
      else if (mode === 'nouns' && accepted.some(a => bare(a) === given)) hint.textContent = 'Слово правильне, а де артикль?';
      else if (mode === 'nouns' && accepted.some(a => bare(a) === bare(given))) hint.textContent = 'Слово правильне, але артикль інший.';
      else if (fails >= 2) hint.innerHTML = `Правильно: <b>${esc(show(answer))}</b> — введи ще раз`;
      else hint.textContent = 'Неправильно, спробуй ще раз.';
      inp.select();
    }
  };
}

async function finishLesson() {
  const wasLesson = lesson.commit, pr = P();
  let learnedNow = 0;
  const before = pr.learned;
  soundFanfare();
  if (wasLesson) {
    clearLesson();
    learnedNow = lesson.end - pr.learned;
    pr.learned = lesson.end;
    if (pr.lastDate !== today()) { pr.days++; pr.lastDate = today(); }
    await save();
  }
  const reviewed = lesson.stages.reduce((n, s) => n + s.tasks.length, 0);
  const lvOf = M().levelOf;
  const newLevel = wasLesson && pr.learned < N() && lvOf(pr.learned) > lvOf(before) ? M().levels[lvOf(pr.learned) - 1] : null;
  const newSteps = wasLesson ? openSteps(pr.learned).filter(t => !openSteps(before).includes(t)) : [];
  view = 'finish';
  $app.innerHTML = `<div class="finish">
    <div class="pic">🎉</div>
    <h2 style="margin:0;font-size:30px">¡Muy bien!</h2>
    <div class="sub">${wasLesson ? `Нових слів: <b>${learnedNow}</b> · Усього вивчено: <b>${pr.learned}</b>` : `Повторено слів: <b>${reviewed}</b>`}</div>
    ${newLevel ? `<div class="panel">Новий рівень: <b>${newLevel.title}</b></div>` : ''}
    ${newSteps.length ? `<div class="panel">Відкрито: <b>${newSteps.join(', ')}</b>. З наступного уроку нові слова тренуються ще й у цій формі.</div>` : ''}
    <button class="cta" id="home">На головну</button></div>`;
  document.getElementById('home').onclick = () => { lesson = null; renderHome(); };
}

ivir|i|0|el pueblo|un|Cuando era niño, {V} en {N} pequeño.|Коли я був дитиною, я жив у невеликому селі.","tener|i|5|el campo|un|Mis abuelos {V} {N} con vacas y gallinas.|У моїх дідуся й бабусі було поле з коровами та курми.","jugar|i|0|el río|sg|Todos los veranos {V} en {N} con mis primos.|Кожного літа я грав у річці з двоюрідними братами.","preparar|i|2|el pastel|un|Mi abuela {V} {N} cada domingo.|Моя бабуся щонеділі пекла пиріг.","contar|i|2|el cuento|un|Por la noche, mi abuelo nos {V} {N} antes de dormir.|Увечері дідусь розповідав нам казку перед сном."]},{"type":"dialog","level":"A2","title":"En la farmacia","lines":["necesitar|p|0|la medicina|un|— Cliente: Buenas tardes, {V} {N} para el dolor de cabeza.|— Клієнт: Добрий день, мені потрібні ліки від головного болю.","doler|p|2|la cabeza|sg|— Farmacéutica: ¿Desde cuándo le {V} {N}?|— Фармацевтка: Відколи у вас болить голова?","tener|p|0|la temperatura|sg|— Cliente: Desde ayer, y también {V} {N} un poco alta.|— Клієнт: Із учорашнього дня, і ще в мене трохи підвищена температура.","tomar|im|2|la medicina|sg|— Farmacéutica: {V} {N} cada ocho horas y descanse.|— Фармацевтка: Приймайте ліки кожні вісім годин і відпочивайте.","costar|p|2|la medicina|sg|— Cliente: Muchas gracias. ¿Cuánto {V} {N}?|— Клієнт: Дуже дякую. Скільки коштують ліки?"]},{"type":"text","level":"A2","title":"Mis vacaciones de verano","lines":["pasar|t|0|el verano|sg|El año pasado {V} {N} en Galicia.|Минулого року я провів літо в Галісії.","alquilar|t|3|el piso|un|Mi familia y yo {V} {N} cerca de la playa.|Ми з родиною винайняли квартиру біля пляжу.","tomar|t|3|el barco|un|Un día {V} {N} para ir a una isla.|Одного дня ми сіли на пором, щоб поїхати на острів.","ver|t|3|el pez|unos|Allí {V} {N} de muchos colores.|Там ми побачили різнокольорових рибок.","perder|t|0|la cartera|sg|Por desgracia, el último día {V} {N} de mi padre.|На жаль, в останній день я загубив гаманець мого тата."]},{"type":"dialog","level":"A2","title":"Una cita","lines":["recibir|p |el coche|sg|Ayer por la tarde, Juan {V} {N} para ir a trabajar.|Учора по обіді Хуан сів у машину, щоб поїхати на роботу.","estar|i|2|la carretera|sg|{N} {V} mojada por la lluvia.|Дорога була мокра від дощу.","cruzar|t|2|la calle|sg|De repente, un gato {V} {N}.|Раптом кіт перебіг вулицю.","girar|t|2|el árbol|un|Juan {V} a la derecha y chocó con {N}.|Хуан повернув праворуч і врізався в дерево.","llegar|t|5|el policía|pl|Por suerte, {N} {V} en cinco minutos y Juan solo tenía un dolor de cuello.|На щастя, поліцейські приїхали за п\u0027ять хвилин, а в Хуана лише боліла шия."]},{"type":"dialog","level":"A2","title":"Buscando piso","lines":["ver|pp|0|el piso|un|— Inés: {V} {N} en el centro, ¿te interesa?|— Інес: Я бачила квартиру в центрі, тобі це цікаво?","costar|p|2|el alquiler|sg|— Raúl: ¿Cuánto {V} {N}?|— Рауль: Скільки коштує оренда?","ser|p|5|la habitación|pl|— Inés: Seiscientos euros, pero {N} {V} muy grandes.|— Інес: Шістсот євро, але кімнати дуже великі.","funcionar|p|2|el ascensor|sg|— Raúl: ¿Y {N} {V} bien?|— Рауль: А ліфт добре працює?","marcar|im|1|el número|sg|— Inés: Sí. {V} {N} y pide una cita para mañana.|— Інес: Так. Набери номер і домовся про зустріч на завтра."]},{"type":"text","level":"A2","title":"Una fiesta sorpresa","lines":["organizar|pp|0|la fiesta|un|Hoy {V} {N} de cumpleaños para mi hermana.|Сьогодні я організувала вечірку на день народження моєї сестри.","decorar|pp|5|la casa|sg|Mis amigos {V} {N} con flores.|Мої друзі прикрасили будинок квітами.","preparar|pp|2|el pastel|un|Mi padre {V} {N} de chocolate.|Мій тато спік шоколадний торт.","llegar|pp|5|el invitado|pl|{N} {V} a las ocho.|Гості прийшли о восьмій.","abrir|pp|2|la puerta|sg|Cuando mi hermana {V} {N}, todos han gritado: «¡Sorpresa!».|Коли моя сестра відчинила двері, усі закричали: «Сюрприз!»."]},{"type":"dialog","level":"A2","title":"El fin de semana pasado","lines":["ver|t|1|la película|sg|— Jorge: ¿Qué tal el fin de semana? ¿{V} {N} nueva?|— Хорхе: Як минув вікенд? Ти бачила новий фільм?","pasar|t|0|el sábado|sg|— Sara: No, al final {V} {N} en el campo con mis primos.|— Сара: Ні, зрештою я провела суботу за містом із двоюрідними братами.","preparar|t|4|la comida|sg|— Jorge: ¡Qué bien! ¿{V} {N} juntos?|— Хорхе: Як чудово! Ви разом готували їжу?","caminar|t|3|el bosque|sg|— Sara: Sí, y luego {V} por {N} hasta la noche.|— Сара: Так, а потім ми гуляли лісом аж до ночі.","quedar|t|0|el gato|sg|— Jorge: Yo me {V} en casa todo el día con {N}.|— Хорхе: А я цілий день просидів удома з котом."]},{"type":"text","level":"A2","title":"Mi primer trabajo","lines":["encontrar|t|0|el trabajo|un|Hace diez años {V} {N} en una cafetería.|Десять років тому я знайшов роботу в кав\u0027ярні.","ser|i|2|el jefe|sg|{N} {V} muy simpático, pero muy exigente.|Начальник був дуже приємний, але дуже вимогливий.","abrir|i|0|la puerta|sg|Cada mañana {V} {N} del local a las seis.|Щоранку я о шостій відчиняв двері закладу.","servir|i|0|el café|sg|Yo {V} {N} y limpiaba las mesas.|Я подавав каву й витирав столи.","comprar|t|0|el regalo|un|Con mi primer sueldo {V} {N} para mi madre.|На першу зарплату я купив подарунок для мами."]},{"type":"dialog","level":"A2","title":"Preparando la cena","lines":["poner|im|1|el pollo|sg|— Paco: {V} {N} en el horno a doscientos grados.|— Пако: Постав курку в духовку на двісті градусів.","lavar|p|0|el tomate|pl|— Eva: Vale. ¿{V} {N} para la ensalada?|— Єва: Гаразд. Помити помідори для салату?","mezclar|im|1|el tomate|pl|— Paco: Sí, y luego {V} {N} con el aceite.|— Пако: Так, а потім змішай помідори з олією.","estar|p|5|el plato|pl|— Eva: ¿Dónde {V} {N}?|— Єва: А де тарілки?","mirar|im|1|el armario|sg|— Paco: {V} en {N} de arriba.|— Пако: Подивися в шафі нагорі."]},{"type":"text","level":"A2","title":"La boda de mi prima","lines":["celebrar|t|3|la boda|sg|El sábado pasado {V} {N} de mi prima Lucía.|Минулої суботи ми святкували весілля моєї двоюрідної сестри Лусії.","llevar|t|2|la novia|sg|{N} {V} un vestido blanco precioso.|Наречена була в чудовій б didato: Porque {V} cinco años en {N} similar y quiero crecer.|— Кандидат: Тому що я п\u0027ять років працював у подібній компанії й хочу розвиватися.","ofrecer|c|2|la empresa|sg|— Directora: ¿Y qué {V} usted a {N}?|— Директорка: А що ви могли б запропонувати компанії?","dirigir|c|0|el equipo|sg|— Candidato: {V} {N} con mucha energía y nuevas ideas.|— Кандидат: Я б очолював команду з великою енергією та новими ідеями.","comunicar|f|3|la decisión|sg|— Directora: Muy bien. Le {V} {N} la próxima semana.|— Директорка: Дуже добре. Ми повідомимо вам рішення наступного тижня."]},{"type":"text","level":"B1","title":"Un viaje inolvidable","lines":["salir|pq|2|el tren|sg|Cuando llegamos a la estación de Lisboa, {N} ya {V}.|Коли ми прибули на вокзал Лісабона, потяг уже поїхав.","mirar|pq|2|el horario|sg|Mi hermano {V} {N} equivocado.|Мій брат подивився не той розклад.","encontrar|t|3|el hotel|un|Por suerte, {V} {N} pequeño cerca del puerto.|На щастя, ми знайшли невеликий готель біля порту.","recomendar|t|2|el restaurante|un|El dueño nos {V} {N} típico de la zona.|Господар порадив нам типовий для цієї місцевості ресторан.","comer|pq|0|el pescado|un|Nunca {V} {N} tan rico como aquella noche.|Я ніколи не їв такої смачної риби, як тієї ночі."]},{"type":"dialog","level":"B1","title":"Consejos de una amiga","lines":["dormir|p|0|el trabajo|sg|— Diego: Últimamente no {V} bien por {N}.|— Дієго: Останнім часом я погано сплю через роботу.","pasear|sp|1|el parque|sg|— Irene: Te recomiendo que {V} por {N} todos los días.|— Ірене: Раджу тобі гуляти парком щодня.","revisar|sp|0|el correo|sg|— Diego: Ya, pero mi jefe quiere que {V} {N} cada noche.|— Дієго: Знаю, але мій начальник хоче, щоб я перевіряв пошту щовечора.","apagar|sp|1|el móvil|sg|— Irene: Pues es importante que {V} {N} cuando termines tu jornada.|— Ірене: Тоді важливо, щоб ти вимикав телефон, коли закінчуєш робочий день.","entender|sp|2|la situación|sg|— Diego: Tienes razón. Ojalá mi jefe {V} {N}.|— Дієго: Ти маєш рацію. Дай Боже, щоб мій начальник зрозумів ситуацію."]},{"type":"text","level":"B1","title":"El cambio climático","lines":["subir|p|2|la temperatura|sg|Cada año {N} {V} más en verano.|Щороку влітку температура зростає дедалі більше.","faltar|f|2|el agua|sg|Los científicos dicen que en el futuro {V} {N} en muchas zonas.|Науковці кажуть, що в майбутньому в багатьох регіонах не вистачатиме води.","desaparecer|f|5|la naturaleza|sg|Muchas especies {V} si no protegemos {N}.|Багато видів зникне, якщо ми не збережемо природу.","aprobar|f|5|la ley|unos|Por eso, los gobiernos {V} {N} nuevas contra la contaminación.|Тому уряди ухвалять нові закони проти забруднення.","poder|p|3|la situación|sg|Pero nosotros también {V} mejorar {N} con pequeños gestos diarios.|Але й ми самі можемо поліпшити ситуацію маленькими щоденними вчинками."]},{"type":"dialog","level":"B1","title":"En el aeropuerto","lines":["salir|pp|2|el vuelo|sg|— Pasajera: Perdone, ¿ya {V} {N} de Roma?|— Пасажирка: Вибачте, рейс до Рима вже вилетів?","salir|t|2|el avión|sg|— Empleado: Lo siento, señora, {N} {V} hace diez minutos.|— Працівник: Вибачте, пані, літак вилетів десять хвилин тому.","abrir|pq|5|la puerta|sg|— Pasajera: ¡No puede ser! Cuando llegué, todavía no {V} {N} de embarque.|— Пасажирка: Не може бути! Коли я прийшла, вихід на посадку ще не відчинили.","reservar|f|0|el billete|un|— Empleado: Lo siento mucho. Le {V} {N} para mañana por la mañana.|— Працівник: Мені дуже шкода. Я забронюю вам квиток на завтра вранці.","pagar|f|5|el hotel|sg|— Pasajera: Gracias. ¿{V} ustedes también {N} de esta noche?|— Пасажирка: Дякую. А готель на цю ніч ви теж оплатите?"]},{"type":"text","level":"B1","title":"La abuela Carmen","lines":["nacer|t|2|el pueblo|un|Mi abuela Carmen {V} en {N} de Andalucía en 1940.|Моя бабуся Кармен народилася в селі в Андалусії 1940 року.","trabajar|i|2|la tierra|sg|De niña, {V} {N} con sus padres.|У дитинстві вона працювала на землі з батьками.","ir|pq|2|la escuela|sg|Nunca {V} a {N}, pero aprendió a leer sola.|Вона ніколи не ходила до школи, але сама навчилася читати.","dejar|t|2|el pueblo|sg|A los veinte años {V} {N} y se fue a Madrid.|У двадцять років вона покинула село й поїхала до Мадрида.","tener|t|2|la tienda|un|Allí {V} {N} de ropa durante cuarenta años.|Там вона сорок років мала магазин одягу."]},{"type":"dialog","level":"B1","title":"Problemas con el ordenador","lines":["funcionar|p|2|el ordenador|sg|— Marcos: No sé qué pasa, pero {N} no {V}.|— Маркос: Не знаю, що відбувається, але комп\u0027ютер не працює.","actualizar|pp|2|el sistema|sg|— Técnica: ¿{V} usted {N} hoy?|— Фахівчиня: Ви сьогодні оновлювали систему?","descargar|pp|0|el programa|un|— Marcos: No, pero {V} {N} para editar fotos.|— Маркос: Ні, але я завантажив програму для редагування фото.","tener|sp|2|el programa|sg|— Técnica: Es posible que {N} {V} un virus.|— Фахівчиня: Можливо, у програмі є вірус.","borrar|sp|0|el programa|sg|— Marcos: Entonces, ¿quiere que {V} {N} ahora mismo?|— Маркос: Тоді ви хочете, щоб я видалив програму просто зараз?"]},{"type":"text","level":"B1","title":"Mi ciudad en el futuro","lines":["ser|f|2|la ciudad|sg|Dentro de veinte años, {N} {V} muy diferente.|Через двадцять років місто буде зовсім іншим.","funcionar|f|5|el coche|pl|Todos {N} {V} con electricidad.|Усі машини працюватимуть на електриці.","construir|f|2|el parque|un|El ayuntamiento {V} {N} nuevo junto al río.|Міська рада збудує новий парк біля річки.","usar|f|2|la bicicleta|sg|La gente {V} {N} para ir al trabajo.|Люди їздитимуть на роботу на велосипеді.","estar|f|2|el cielo|sg|Y quizá {N} {V} mucho más limpio.|І, можливо, небо буде набагато чистішим."]},{"type":"dialog","level":"B1","title":"Una queja en el hotel","lines":["funcionar|p|2|la ducha|sg|— Cliente: Perdone, {N} de mi habitación no {V}.|— Клієнт: Вибачте, душ у моєму номері не працює.","parecer|c|2|la habitación|un|— Recepcionista: Lo siento mucho. ¿Le {V} bien {N} en el tercer piso?|— Адміністраторка: Мені дуже шкода. Вам підійшов би номер на третьому поверсі?","subir|sp|2|la maleta|pl|— Cliente: Sí, pero necesito que alguien {V} {N}.|— Клієнт: Так, але мені потрібно, щоб хтось підняв валізи.","subir|f|2|el compañero|un|— Recepcionista: Por supuesto. {N} se las {V} enseguida.|— Адміністраторка: Звісно. Колега зараз же їх підніме.","poder|c|5|el desayuno|sg|— Cliente: Muchas gracias. ¿{V} ustedes incluir también {N}?|— Клієнт: Дуже дякую. Чи не могли б ви також включити сніданок?"]},{"type":"text","level":"B1","title":"La entrevista de Ana","lines":["preparar|pq|2|la entrevista|sg|Ana {V} {N} durante semanas.|Ана готувалася до співбесіди протягом кількох тижнів.","leer|pq|2|el artículo|pl|{V} todos {N} sobre la empresa.|Вона прочитала всі статті про компанію.","perder|t|2|el autobús|sg|Sin embargo, aquella mañana {V} {N} y llegó tarde.|Проте того ранку вона запізнилася на автобус і спізнилася.","entender|t|2|la situación|sg|Por suerte, el director {V} {N}.|На щастя, директор зрозумів ситуацію.","recibir|t|2|la llamada|un|Una semana después, Ana {V} {N} con la oferta de trabajo.|Через тиждень Ана отримала дзвінок із пропозицією роботи."]},{"type":"dialog","level":"B1","title":"Organizar una excursión","lines":["visitar|f|3|el parque|sg|— Profesor: El viernes {V} {N} natural de la sierra.|— Вчитель: У п\u0027ятницю ми відвідаємо природний парк у горах.","llevar|sp|3|la comida|sg|— Alumna: ¿Es necesario que {V} {N}?|— Учениця: Чи потрібно нам брати їжу?","traer|sp|4|la bota|pl|— Profesor: Sí, y también quiero que {V} {N} y ropa de abrigo.|— Вчитель: Так, і ще я хочу, щоб ви принесли черевики й теплий одяг.","salir|f|2|el autobús|sg|— Alumna: ¿Y a qué hora {V} {N}?|— Учениця: А о котрій вирушить автобус?","olvidar|sp|4|la mochila|sg|— Profesor: A las ocho en punto, así que no {V} {N}.|— Вчитель: Рівно о восьмій, тож не забудьте рюкзаки."]},{"type":"text","level":"B1","title":"Un problema en el barrio","lines":["molestar|p|2|el ruido|sg|Desde hace meses, {N} de la fábrica {V} a los vecinos.|Уже кілька місяців шум від фабрики дошкуляє сусідам.","enviar|pp|2|la queja|un|La asociación del barrio {V} {N} al ayuntamiento.|Районна асоціація надіслала скаргу до міської ради.","parar|sp|2|la máquina|pl|Los vecinos exigen que la empresa {V} {N} por la noche.|Сусіди вимагають, щоб підприємство зупиняло верстати вночі.","organizar|sp|2|la reunión|un|También piden que el alcalde {V} {N} con ellos.|Також вони просять, щоб мер організував із ними зустріч.","resolver|sp|2|el problema|sg|Todos esperan que se {V} {N} pronto.|Усі сподіваються, що проблему скоро розв\u0027яжуть."]},{"type":"dialog","level":"B1","title":"Antes de la boda","lines":["llegar|f|2|el vestido|sg|— Elena: ¿Crees que {N} {V} a tiempo?|— Олена: Як думаєш, сукня прийде вчасно?","confirmar|t|2|la fecha|sg|— Hugo: Seguro que sí; la tienda me {V} {N} ayer.|— Уго: Упевнений, що так; крамниця підтвердила мені дату вчора.","cambiar|sp|2|el tiempo|sg|— Elena: Ojalá no {V} {N} el día de la boda.|— Олена: Дай Боже, щоб погода не змінилася в день весілля.","celebrar|f|3|la fiesta|sg|— Hugo: Tranquila. Si llueve, {V} {N} dentro del restaurante.|— Уго: Не хвилюйся. Якщо піде дощ, ми відсвяткуємо всередині ресторану.","organizar|c|0|la boda|sg|— Elena: Tienes razón. Sin ti no {V} {N} tan bien.|— Олена: Ти маєш рацію. Без тебе я б не організувала весілля так добре."]},{"type":"text","level":"B2","title":"Si hubiera estudiado","lines":["preparar|spq|0|el examen|sg|Si {V} {N} con más tiempo, habría aprobado sin problemas.|Якби я готувалася до іспиту довше, то склала б його без проблем.","regalar|cp|5|el viaje|un|Mis padres me {V} {N} a Italia.|Мої батьки подарували б мені подорож до Італії.","perder|cp|0|el verano|sg|Además, no {V} {N} estudiando.|До того ж я б не втратила літо на навчання.","seguir|spq|0|el consejo|pl|Ojalá {V} {N} de mi profesora desde el principio.|Шкода, що я не слухала поради моєї викладачки з самого початку.","hacer|f|0|el plan|un|Para el próximo examen, {V} {N} de estudio detallado.|До наступного іспиту я складу детальний план навчання."]},{"type":"dialog","level":"B2","title":"Un malentendido","lines":["contestar|si|1|la llamada|pl|— Lucía: Me molestó mucho que no {V} {N} anoche.|— Лусія: Мене дуже засмутило, що ти не відповідав на дзвінки вчора ввечері.","olvidar|t|2|el móvil|sg|— Andrés: Lo siento, se me {V} {N} en casa de mis padres.|— Андрес: Вибач, я забув телефон у батьків удома.","dejar|spp|1|el móvil|sg|— Lucía: Pues no creo que {V} {N} allí sin querer.|— Лусія: Ну, я не думаю, що ти залишив телефон там ненавмисно.","guardar|fp|2|el armario|sg|— Andrés: Te lo juro. A estas horas mi madre ya lo {V} en {N} de su cocina.|— Андрес: Присягаюся тобі. О цій порі мама вже, мабуть, поклала його в кухонну шафу.","mandar|sp|1|el mensaje|un|— Lucía: Vale, pero la próxima vez quiero que me {V} {N}.|— Лусія: Гаразд, але наступного разу я хочу, щоб ти надіслав мені повідомлення."]},{"type":"text","level":"B2","title":"La crisis económica","lines":["aumentar|pp|2|el desempleo|sg|En los últimos años, {N} {V} de forma preocupante.|Останніми роками безробіття тривожно зросло.","pedir|pp|5|el préstamo|un|Muchas familias {V} {N} para pagar la hipoteca.|Багато родин взяли кредит, щоб платити за іпотеку.","bajar|si|2|el impuesto|pl|Los expertos recomendaron que el gobierno {V} {N}.|Експерти порадили, щоб уряд знизив податки.","aumentar|c|2|el nivel|sg|Sin embargo, esa medida {V} {N} de la deuda pública.|Проте цей захід збільшив би рівень державного боргу.","llegar|sp|5|el acuerdo|un|Por eso, muchos ciudadanos exigen que los políticos {V} a {N} cuanto antes.|Тому багато громадян вимагають, щоб політики якнайшвидше дійшли згоди."]},{"type":"dialog","level":"B2","title":"La mudanza","lines":["vaciar|fp|3|el piso|sg|— Pilar: ¿Crees que para el viernes {V} {N}?|— Пілар: Як думаєш, до п\u0027ятниці ми встигнемо звільнити квартиру?","transportar|f|3|el sofá|sg|— Tomás: Seguro. Mañana {V} {N} y los muebles grandes.|— Томас: Звісно. Завтра перевеземо диван і великі меблі.","recibir|spp|2|la llave|sg|— Pilar: Espero que la vecina {V} {N} que le dejamos.|— Пілар: Сподіваюся, сусідка отримала ключ, який ми їй залишили.","envolver|im|1|el vaso|pl|— Tomás: Sí, me escribió ayer. Oye, {V} {N} con cuidado, que son de cristal.|— Томас: Так, вона написала мені вчора. Слухай, обережно загортай склянки, вони скляні.","envolver|pp|0|el plato|pl|— Pilar: Tranquilo, ya {V} {N} en papel de periódico.|— Пілар: Не хвилюйся, я вже загорнула тарілки в газетний папір."]},{"type":"text","level":"B2","title":"Un científico olvidado","lines":["realizar|t|2|el descubrimiento|un|A principios del siglo XX, un joven químico {V} {N} sorprendente.|На початку XX століття молодий хімік зробив дивовижне відкриття.","investigar|pq|2|la propiedad|pl|Durante años {V} {N} de los metales en un pequeño laboratorio.|Протягом років він досліджував властивості металів у маленькій лабораторії.","hacer|si|2|el hallazgo|un|Sin embargo, la comunidad científica no aceptó que un desconocido {V} {N} tan importante.|Проте наукова спільнота не прийняла того, що невідома людина зробила таке важливе відкриття.","publicar|t|2|el resultado|pl|Otro investigador {V} {N} y se hizo famoso.|Інший дослідник опублікував результати й став відомим.","merecer|i|2|el prestigio|sg|Hoy los historiadores reconocen que el joven químico {V} {N} que nunca recibió.|Сьогодні історики визнають, що молодий хімік заслуговував на славу, якої так і не отримав."]},{"type":"dialog","level":"B2","title":"Negociando un contrato","lines":["ofrecer|c|3|la ventaja|un|— Directora: Le {V} {N} importante si firmara hoy.|— Директорка: Ми запропонували б вам важливу перевагу, якби ви підписали сьогодні.","garantizar|si|5|la fecha|sg|— Cliente: Preferiría que ustedes me {V} {N} de entrega.|— Клієнт: Я б волів, щоб ви гарантували мені дату доставки.","complicar|c|2|el proceso|sg|— Directora: Eso {V} {N} de producción.|— Директорка: Це ускладнило б виробничий процес.","firmar|cp|0|el contrato|sg|— Cliente: Si me lo hubieran dicho antes, no {V} {N} el año pasado.|— Клієнт: Якби мені сказали це раніше, я б не підписував контракт торік.","revisar|f|0|la condición|pl|— Directora: Entiendo. {V} {N} con mi equipo y le llamaré mañana.|— Директорка: Розумію. Я перегляну умови зі своєю командою й зателефоную вам завтра."]},{"type":"text","level":"B2","title":"Viajar solo","lines":["vivir|spp|1|la experiencia|sg|Quizá nunca {V} {N} de viajar solo.|Можливо, ти ніколи не відчував, що таке подорожувати наодинці.","parecer|p|2|la soledad|sg|Al principio, {N} {V} difícil de soportar.|Спочатку самотність здається важкою для витримування.","descubrir|sp|1|el rincón|pl|Sin embargo, es probable que {V} {N} más bonitos de cada ciudad.|Проте ймовірно, що ти відкриєш найгарніші куточки кожного міста.","crecer|f|2|la confianza|sg|Además, {N} en ti mismo {V} día a día.|До того ж упевненість у собі зростатиме день за днем.","desarrollar|cp|0|la seguridad|sg|Sin mi primer viaje, yo no {V} {N} que tengo hoy.|Без моєї першої подорожі в мене не було б тієї впевненості, яку я маю сьогодні."]},{"type":"dialog","level":"C1","title":"Una reunión tensa","lines":["presentar|spp|2|el presupuesto|sg|— Gerente: Me sorprende que nadie {V} {N} todavía.|— Менеджер: Мене дивує, що ніхто досі не подав бюджет.","bloquear|fp|2|el sistema|sg|— Analista: Lo enviamos ayer; {N} lo {V} por error.|— Аналітик: Ми надіслали його вчора; система, мабуть, помилково його заблокувала.","revisar|si|5|la cifra|pl|— Gerente: Aun así, les pedí que {V} {N} antes del lunes.|— Менеджер: Усе одно я просив вас перевірити цифри до понеділка.","causar|pp|2|la inflación|sg|— Analista: Las revisamos, pero {N} {V} problemas inesperados.|— Аналітик: Ми їх перевірили, але інфляція спричинила непередбачені проблеми.","explicar|sp|5|la estrategia|sg|— Gerente: Entonces quiero que me {V} {N} antes de la reunión con los accionistas.|— Менеджер: Тоді я хочу, щоб ви пояснили мені стратегію перед зустріччю з акціонерами."]},{"type":"text","level":"C1","title":"La memoria colectiva","lines":["construir|p|5|la identidad|sg|Las sociedades {V} {N} a través de sus relatos.|Суспільства будують свою ідентичність через власні розповіді.","conservar|spq|5|el documento|pl|Si los historiadores no {V} {N} de las víctimas, hoy sabríamos mucho menos.|Якби історики не зберегли документи жертв, сьогодні ми знали б набагато менше.","desaparecer|cp|2|la memoria|sg|Sin esos archivos, {N} de muchas comunidades {V} por completo.|Без цих архівів пам\u0027ять багатьох громад зникла б повністю.","analizar|sp|2|el pasado|sg|Hoy los expertos insisten en que se {V} {N} sin prejuicios.|Сьогодні експерти наполягають, щоб минуле аналізували без упереджень.","fortalecer|f|2|el vínculo|sg|Solo así se {V} {N} entre generaciones.|Лише так зміцниться зв\u0027язок між поколіннями."]},{"type":"dialog","level":"C1","title":"Un dilema ético","lines":["aceptar|c|1|el soborno|sg|— Clara: ¿Tú {V} {N} si nadie se fuera a enterar?|— Клара: Ти б прийняв хабар, якби ніхто ніколи не дізнався?","dejar|c|2|la conciencia|sg|— Iván: Jamás; {N} no me {V} en paz.|— Іван: Ніколи; совість не дала б мені спокою.","mantener|cp|2|el cargo|sg|— Clara: Pues mi antiguo jefe lo hizo y, si nadie lo hubiera denunciado, {V} {N}.|— Клара: А мій колишній начальник узяв, і якби ніхто його не викрив, зберіг би посаду.","descubrir|t|2|el engaño|sg|— Iván: ¿Y quién {V} {N}?|— Іван: А хто викрив обман?","perder|si|2|la confianza|sg|— Clara: Una compañera; temía que la empresa {V} {N} de los clientes.|— Клара: Одна колега; вона боялася, що компанія втратить довіру клієнтів."]},{"type":"text","level":"C1","title":"El precio del éxito","lines":["perseguir|pq|2|el sueño|sg|Cuando por fin ganó el premio, Marta ya {V} {N} de ser actriz durante una década.|Коли Марта нарешті здобула премію, вона вже десять років мріяла стати актрисою.","descuidar|pq|2|la relación|sg|Para lograrlo, {V} {N} con su familia.|Щоб цього досягти, вона занедбала стосунки з родиною.","gestionar|spq|2|la carrera|sg|Más tarde confesó que ojalá {V} {N} de otra e es que la melancolía no nos {V} {N} de vivir el presente.|Важливо, щоб меланхолія не відібрала в нас радість жити теперішнім."]},{"type":"dialog","level":"C2","title":"El juicio","lines":["estallar|t|2|el incendio|sg|— Fiscal: ¿Dónde estaba usted cuando {V} {N}?|— Прокурор: Де ви були, коли спалахнула пожежа?","abandonar|pq|0|el edificio|sg|— Acusado: Ya {V} {N} antes de las diez.|— Обвинувачений: Я вже залишив будівлю до десятої.","afirmar|p|2|el testigo|sg|— Fiscal: Sin embargo, {N} {V} que lo vio salir a medianoche.|— Прокурор: Проте свідок стверджує, що бачив, як ви вийшли опівночі.","avisar|cp|2|la autoridad|pl|— Acusado: Si de verdad me hubiera visto, {V} a {N} aquella misma noche.|— Обвинувачений: Якби він справді мене бачив, то повідомив би владу тієї ж ночі.","tomar|fp|2|la decisión|sg|— Fiscal: Eso lo decidirá el jurado; para el viernes ya {V} {N}.|— Прокурор: Це вирішуватимуть присяжні; до п\u0027ятниці вони вже ухвалять рішення."]},{"type":"text","level":"C2","title":"El ocaso de un reino","lines":["dejar|pq|2|el reino|sg|Cuando el último rey subió al trono, {N} ya {V} atrás su apogeo.|Коли останній король зійшов на трон, королівство вже минуло свій розквіт.","debilitar|pq|2|la estructura|sg|La corrupción {V} {N} de las instituciones.|Корупція підірвала структуру установ.","reformar|si|2|el ejército|sg|Los consejeros le rogaron que {V} {N} cuanto antes.|Радники благали його якнайшвидше реформувати армію.","formar|spq|5|la alianza|un|Si los nobles {V} {N} contra los invasores, el reino habría sobrevivido.|Якби шляхтичі утворили союз проти загарбників, королівство вціліло б.","provocar|t|5|el colapso|sg|Sin embargo, la avaricia y el orgullo {V} {N} definitivo.|Проте жадібність і гординя спричинили остаточний крах."]}]};
const VIDX = new Map(VERBS.map((v, i) => [v.es, i])), NIDX = new Map(NOUNS.map((n, i) => [n.es, i]));
function parseEx(s) {
  const [verb, tense, person, noun, form, text, ua] = s.split('|');
  return { verb, tense, k: +person, noun, form, text, ua: ua || '', vi: VIDX.get(verb), ni: NIDX.get(noun) };
}
const EX_SINGLES = RAW_EX.singles.map(parseEx).filter(x => x.vi != null && x.ni != null);
const EX_BLOCKS = RAW_EX.blocks.map(b => ({ ...b, lines: b.lines.map(parseEx) })).filter(b => b.lines.length === 5 && b.lines.every(x => x.vi != null && x.ni != null));
const FORM_HINT = { sg: '', pl: 'множина', un: 'неозначений артикль', unos: 'неозначений артикль, множина' };

function exOpen() {
  const vl = state.verbs.learned, nl = state.nouns.learned;
  const tenses = new Set(['p', ...tensesFor(vl).map(t => t.k)]);
  const ok = x => x.vi < vl && x.ni < nl && tenses.has(x.tense);
  return { singles: EX_SINGLES.filter(ok), blocks: EX_BLOCKS.filter(b => b.lines.every(ok)) };
}
function exAnswers(x) {
  const v = VERBS[x.vi], n = NOUNS[x.ni];
  return { V: conjugate(v.es, v.fl)[x.tense][x.k], N: n[x.form === 'sg' ? 'es' : x.form] };
}

// Offline usage examples for the dictionary: up to 3 bank sentences with this word, presente first.
function examplesHtml(v) {
  const isNoun = mode === 'nouns';
  const all = [...EX_SINGLES, ...EX_BLOCKS.flatMap(b => b.lines)].filter(x => (isNoun ? x.noun : x.verb) === v.es && x.ua);
  const picked = [...all.filter(x => x.tense === 'p'), ...all.filter(x => x.tense !== 'p')].slice(0, 3);
  if (!picked.length) return '';
  return `<div class="examples"><div class="ft">Приклади</div>${picked.map(x => `<p>${fillLine(x, true)}<br><span class="ex-ua-small">${esc(x.ua)}</span></p>`).join('')}</div>`;
}

function renderExHome() {
  view = 'home';
  const open = exOpen(), ex = state.ex;
  const dialogs = open.blocks.filter(b => b.type === 'dialog').length, texts = open.blocks.length - dialogs;
  const ready = open.singles.length >= 5 || open.blocks.length;
  $app.innerHTML = `

    <div class="panel" style="display:grid;gap:12px">
      <div class="stats">
        <div><b>${open.singles.length}</b><small>речень</small></div>
        <div><b>${dialogs}</b><small>діалогів</small></div>
        <div><b>${texts}</b><small>текстів</small></div>
      </div>
      <div class="cue">Відкрито з ${EX_SINGLES.length} речень, ${EX_BLOCKS.length} діалогів і текстів. Що більше вивчених дієслів та іменників, то більше вправ.</div>
    </div>

      <b>Як це працює</b>

      <div class="cue">Вивчено: ${state.verbs.learned} дієслів, ${state.nouns.learned} іменників${tensesFor(state.verbs.learned).length ? ` · часи: presente, ${tensesFor(state.verbs.learned).filter(t => t.k !== 'p').map(t => t.es).join(', ')}` : ' · час: presente'}</div>
    </div>
    ${ready ? `<button class="cta" id="ex-start">Нова вправа · 5 речень</button>` :
      `<div class="panel done-note">Поки замало слів для вправ.<br><span class="sub">Потрібні вивчені й дієслова, і іменники. Пройди кілька уроків у розділах «Дієслова» та «Іменники».</span></div>`}
    <label class="toggle"><input type="checkbox" id="sound" ${state.sound !== false ? 'checked' : ''}><span>Звукові сигнали (на iPhone чути, коли вимкнено беззвучний режим)</span></label>

  bindTop();
  const st = document.getElementById('ex-start');

let exr = null;
function startExercise() {
  const open = exOpen();
  const choices = [];
  if (open.singles.length >= 5) choices.push('singles');
  if (open.blocks.some(b => b.type === 'dialog')) choices.push('dialog');
  if (open.blocks.some(b => b.type === 'text')) choices.push('text');
  const kind = pick(choices);
  const recent = state.ex.recent || [];
  if (kind === 'singles') {
    // Prefer sentences not seen in the last few exercises.
    const fresh = open.singles.filter(x => !recent.includes(x.verb + x.tense));
    const pool = fresh.length >= 5 ? fresh : open.singles;
    const picked = [], verbs = new Set();
    for (const x of shuffle(pool)) { if (!verbs.has(x.verb)) { picked.push(x); verbs.add(x.verb); } if (picked.length === 5) break; }
    exr = { kind, title: '5 окремих речень', lines: picked, i: 0 };
  } else {
    const blocks = open.blocks.filter(b => b.type === kind);
    const fresh = blocks.filter(b => !recent.includes('#' + b.title));
    const b = pick(fresh.length ? fresh : blocks);
    exr = { kind, title: `${kind === 'dialog' ? 'Діалог' : 'Текст'} · ${b.title}`, lines: b.lines, i: 0, block: b.title };
  }
  renderExTask();
}

const startsSentence = before => /^(—\s*)?([A-ZÁÉÍÓÚÑ][\wáéíóúñ]*:\s*)?[¿¡"«]?$/.test(before.trim() === '' ? '' : before.replace(/\s+$/, ''));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function fillLine(x, shown) {
  const a = exAnswers(x);
  let html = esc(x.text);
  for (const key of ['V', 'N']) {
    const at = html.indexOf(`{${key}}`), before = html.slice(0, at);
    let val = alts(a[key])[0];
    if (startsSentence(before)) val = cap(val);
    html = html.replace(`{${key}}`, shown ? `<b class="filled">${esc(val)}</b>` : `<span class="gap">${key === 'V' ? '①' : '②'} ____</span>`);
  }
  return html;
}

function renderExTask() {
  view = 'lesson';
  const x = exr.lines[exr.i], a = exAnswers(x);
  const v = VERBS[x.vi], n = NOUNS[x.ni], t = TENSES.find(z => z.k === x.tense);
  const order = x.text.indexOf('{V}') < x.text.indexOf('{N}') ? ['V', 'N'] : ['N', 'V'];
  const hints = {
    V: `① дієслово <b>${esc(v.es)}</b> · ${t.ua.toLowerCase()} (${t.es})`,
    N: `② іменник з артиклем · <b>${esc(n.ua)}</b>${FORM_HINT[x.form] ? ' · ' + FORM_HINT[x.form] : ''}`,
  };
  const context = exr.kind === 'singles' ? '' : exr.lines.slice(0, exr.i).map(l => `<p>${fillLine(l, true)}</p>`).join('');
  $app.innerHTML = `
    <div class="top"><button class="x" id="quit" aria-label="Вийти">✕</button><div class="bar"><i style="width:${exr.i / 5 * 100}%"></i></div><span class="count">${exr.i}/5</span></div>
    <div class="stage">${esc(exr.title)}</div>
    ${context ? `<div class="panel ex-context">${context}</div>` : ''}
    <div class="panel ex-sentence">${fillLine(x, false)}</div>
    <form class="typing" id="f" autocomplete="off">
      ${order.map(key => `<label class="ex-hint" for="in-${key}">${hints[key]}</label>
        <input class="inp" id="in-${key}" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${key === 'V' ? 'Форма дієслова' : 'Іменник з артиклем'}">`).join('')}
      <div class="keys">${['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü'].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>
      <div class="hint" id="hint"></div>
      <button class="cta" type="submit">Перевірити</button>
    </form>`;
  document.getElementById('quit').onclick = () => { exr = null; renderHome(); };
  const inputs = { V: document.getElementById('in-V'), N: document.getElementById('in-N') };
  let last = inputs[order[0]], fails = { V: 0, N: 0 }, done = { V: false, N: false };
  last.focus();
  Object.values(inputs).forEach(inp => {
    inp.addEventListener('focus', () => { last = inp; });
    inp.oninput = () => inp.classList.remove('bad');
  });
  document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
    const inp = last, s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0, s) + b.dataset.key + inp.value.slice(e);
    inp.focus(); inp.setSelectionRange(s + 1, s + 1); inp.classList.remove('bad');
  });
  const hint = document.getElementById('hint');
  document.getElementById('f').onsubmit = ev => {
    ev.preventDefault();
    if (done.V && done.N) return;
    const msgs = [];
    for (const key of order) {
      if (done[key]) continue;
      const inp = inputs[key], given = norm(inp.value), accepted = alts(a[key]).map(norm);
      if (accepted.includes(given)) { done[key] = true; inp.classList.remove('bad'); inp.classList.add('ok'); inp.readOnly = true; continue; }
      fails[key]++;
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('bad', 'shake');
      const noAcc = s => s.normalize('NFD').replace(/[́̈]/g, '');
      const bare = s => s.replace(/^(el|la|los|las|un|una|unos|unas) /, '');
      const label = key === 'V' ? '①' : '②';
      if (!given) msgs.push(`${label}: заповни поле.`);
      else if (accepted.some(z => noAcc(z) === noAcc(given))) msgs.push(`${label}: перевір наголоси.`);
      else if (key === 'N' && accepted.some(z => bare(z) === given)) msgs.push(`${label}: додай артикль.`);
      else if (key === 'N' && accepted.some(z => bare(z) === bare(given))) msgs.push(`${label}: артикль інший.`);
      else if (fails[key] >= 2) msgs.push(`${label}: правильно <b>${esc(show(a[key]))}</b>`);
      else msgs.push(`${label}: неправильно, спробуй ще.`);
    }
    if (done.V && done.N) {
      hint.innerHTML = '';
      soundOk();
      document.querySelector('.ex-sentence').innerHTML = fillLine(x, true) + (x.ua ? `<div class="ex-ua">${esc(x.ua)}</div>` : '');
      speak(fillLine(x, true).replace(/<[^>]+>/g, ''));
      const btn = document.querySelector('#f .cta');
      btn.textContent = exr.i === 4 ? 'Завершити' : 'Далі →';
      btn.type = 'button';
      btn.onclick = () => { exr.i++; exr.i >= 5 ? finishExercise() : renderExTask(); };
      btn.focus();
    } else {
      buzz();
      hint.innerHTML = msgs.join('<br>');
      const firstBad = order.find(k => !done[k]);
      inputs[firstBad].select();
    }
  };
}

async function finishExercise() {
  soundFanfare();
  const keys = exr.block ? ['#' + exr.block] : exr.lines.map(x => x.verb + x.tense);
  state.ex.recent = [...keys, ...(state.ex.recent || [])].slice(0, 60);
  state.ex.done++;
  state.ex.lastDate = today();
  await save();
  const all = exr.lines.map(l => `<p>${fillLine(l, true)}${l.ua ? `<br><span class="ex-ua-small">${esc(l.ua)}</span>` : ''}</p>`).join('');
  view = 'finish';
  $app.innerHTML = `<div class="finish">
    <div class="pic">🏅</div>
    <h2 style="margin:0;font-size:30px">¡Excelente!</h2>
    <div class="sub">Вправу виконано · усього вправ: <b>${state.ex.done}</b></div>
    <div class="panel ex-context" style="text-align:left">${all}</div>
    <button class="cta" id="again">Ще одна вправа</button>
    <button class="cta ghost" id="home">На головну</button></div>`;
  document.getElementById('again').onclick = startExercise;
  document.getElementById('home').onclick = () => { exr = null; renderHome(); };
}

/* ---------- Game: Ukrainian word + picture, pick the Spanish word in 5 seconds; one mistake ends the run ----------
   Results are kept on this device for everyone who plays (by nickname), grouped by the chosen levels. */
const GAME_SECONDS = 5;
const GAME_RESULTS_KEY = 'vav-game-results', GAME_NICK_KEY = 'vav-game-nick', GAME_LEVELS_KEY = 'vav-game-levels';
const GAME_WORDS = [
  ...VERBS.map(v => ({ es: v.es, ua: v.ua, em: v.em, cefr: v.cefr, type: 'v' })),
  ...NOUNS.map(n => ({ es: n.es, ua: n.ua, em: n.em, cefr: n.cefr, type: 'n' })),
];
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const levelsKey = lv => CEFR.filter(L => lv.includes(L)).join('+');
// Two words clash when their translations share a sense, e.g. "відповідати" for responder and contestar.
const senses = ua => ua.toLowerCase().replace(/\([^)]*\)/g, '').split(/[,;]/).map(s => s.trim()).filter(Boolean);
const clash = (a, b) => { const s = new Set(senses(a.ua)); return senses(b.ua).some(x => s.has(x)); };

let game = null, gameTimer = null;

function renderGameHome() {
  view = 'home';
  const savedNick = lsGet(GAME_NICK_KEY, '') || (STANDALONE ? nick : '');
  const chosen = lsGet(GAME_LEVELS_KEY, ['A1']);
  const counts = Object.fromEntries(CEFR.map(L => [L, GAME_WORDS.filter(w => w.cefr === L).length]));
  $app.innerHTML = `
    ${homeTop('гра')}
    <div class="panel" style="display:grid;gap:10px">
      <b>Як грати</b>
      <div class="sub">З'являється слово українською з картинкою. За ${GAME_SECONDS} секунд вибери правильне іспанське слово з чотирьох. Одна помилка або вийшов час — гра закінчена. Слова щоразу перемішуються.</div>
    </div>
    <form class="panel" id="gform" style="display:grid;gap:12px" autocomplete="off">
      <label class="ex-hint" for="gnick">Нік гравця</label>
      <input class="inp" id="gnick" maxlength="24" value="${esc(savedNick)}" placeholder="введи нік" style="font-size:20px" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="ex-hint">Рівні слів (можна кілька)</div>
      <div class="chips">${CEFR.map(L => `<button type="button" class="chip" data-lv="${L}" aria-pressed="${chosen.includes(L)}">${L}<small>${counts[L]}</small></button>`).join('')}</div>
      <div class="hint" id="ghint"></div>
      <button class="cta" type="submit">▶ Почати гру</button>
    </form>
    <div class="panel" style="display:grid;gap:10px">
      <div class="row" style="align-items:center"><b style="flex:1 1 auto">Таблиця результатів</b>
        <select id="gfilter" aria-label="Рівні" style="flex:0 1 auto;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></select></div>
      <div id="gboard"></div>
    </div>
    <label class="toggle"><input type="checkbox" id="sound" ${state.sound !== false ? 'checked' : ''}><span>Звукові сигнали (на iPhone чути, коли вимкнено беззвучний режим)</span></label>`;
  bindTop();
  const snd = document.getElementById('sound');
  snd.onchange = () => { state.sound = snd.checked; save(); soundOk(); };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    const lv = [...document.querySelectorAll('.chip[aria-pressed="true"]')].map(x => x.dataset.lv);
    lsSet(GAME_LEVELS_KEY, lv);
    drawBoard(levelsKey(lv));
  });
  document.getElementById('gform').onsubmit = ev => {
    ev.preventDefault();
    const name = document.getElementById('gnick').value.trim().replace(/\s+/g, ' ');
    const lv = [...document.querySelectorAll('.chip[aria-pressed="true"]')].map(x => x.dataset.lv);
    const hint = document.getElementById('ghint');
    if (!name) { hint.textContent = 'Спершу введи нік.'; document.getElementById('gnick').focus(); return; }
    if (!lv.length) { hint.textContent = 'Вибери хоча б один рівень.'; return; }
    lsSet(GAME_NICK_KEY, name); lsSet(GAME_LEVELS_KEY, lv);
    startGame(name, lv);
  };
  drawBoard(levelsKey(chosen));
}

function drawBoard(preferKey) {
  const results = lsGet(GAME_RESULTS_KEY, []);
  const sel = document.getElementById('gfilter'), box = document.getElementById('gboard');
  const keys = [...new Set([preferKey, ...results.map(r => r.levels)].filter(Boolean))];
  sel.innerHTML = keys.map(k => `<option value="${k}">${k}</option>`).join('');
  sel.value = preferKey && keys.includes(preferKey) ? preferKey : keys[0] || '';
  const draw = () => {
    const rows = results.filter(r => r.levels === sel.value).sort((a, b) => b.score - a.score || a.date.localeCompare(b.date)).slice(0, 20);
    box.innerHTML = rows.length ? `<div style="overflow-x:auto"><table class="ctab gtab"><tr><th>#</th><th>Нік</th><th>Слів</th><th>Дата</th></tr>
      ${rows.map((r, i) => `<tr><td>${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</td><td>${esc(r.nick)}</td><td><b>${r.score}</b></td><td>${esc(r.date)}</td></tr>`).join('')}</table></div>`
      : `<div class="cue">Для рівнів ${esc(sel.value || '—')} ще немає результатів. Зіграй першим!</div>`;
  };
  sel.onchange = draw;
  draw();
}

function startGame(name, levels) {
  game = { nick: name, levels, key: levelsKey(levels), deck: shuffle(GAME_WORDS.filter(w => levels.includes(w.cefr))), i: 0, score: 0 };
  renderGameTask();
}

function gameOptions(w) {
  // Distractors: same kind of word (verb/noun), preferably the same level, never a word with the same meaning.
  const sameLevel = GAME_WORDS.filter(x => x.type === w.type && x.cefr === w.cefr && x.es !== w.es && !clash(x, w));
  const pool = sameLevel.length >= 3 ? sameLevel : GAME_WORDS.filter(x => x.type === w.type && x.es !== w.es && !clash(x, w));
  const out = [];
  for (const x of shuffle(pool)) { if (!out.some(o => o.es === x.es || clash(o, x))) out.push(x); if (out.length === 3) break; }
  return shuffle([w, ...out]);
}

function renderGameTask() {
  view = 'lesson';
  clearTimeout(gameTimer);
  if (game.i >= game.deck.length) return endGame(null, true);
  const w = game.deck[game.i], opts = gameOptions(w);
  $app.innerHTML = `
    <div class="top"><button class="x" id="quit" aria-label="Вийти">✕</button>
      <div class="bar gtimer"><i id="gt"></i></div><span class="count">⭐ ${game.score}</span></div>
    <div class="stage">Гра · ${esc(game.key)} · ${esc(game.nick)}</div>
    <div class="card">${picHtml(w.em, 84)}<div class="word ua">${esc(w.ua)}</div><div class="sub">${w.type === 'v' ? 'дієслово' : 'іменник'}</div></div>
    <div class="opts" id="opts">${opts.map((o, k) => `<button class="opt es" data-k="${k}">${esc(o.es)}</button>`).join('')}</div>`;
  document.getElementById('quit').onclick = () => { clearTimeout(gameTimer); game = null; renderHome(); };
  const bar = document.getElementById('gt');
  bar.style.transition = 'none'; bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${GAME_SECONDS}s linear`; bar.style.width = '0%'; }));
  let done = false;
  gameTimer = setTimeout(() => { if (done) return; done = true; lock(); endGame(w, false, 'Час вийшов'); }, GAME_SECONDS * 1000);
  const lock = () => document.querySelectorAll('#opts .opt').forEach(b => b.disabled = true);
  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => {
    if (done) return;
    done = true; clearTimeout(gameTimer); lock();
    const pickd = opts[+b.dataset.k];
    const freeze = getComputedStyle(bar).width; bar.style.transition = 'none'; bar.style.width = freeze;
    if (pickd.es === w.es) {
      b.classList.add('ok'); soundOk();
      game.score++; game.i++;
      setTimeout(renderGameTask, 350);
    } else {
      b.classList.add('bad'); buzz();
      document.querySelectorAll('#opts .opt').forEach(x => { if (opts[+x.dataset.k].es === w.es) x.classList.add('ok'); });
      setTimeout(() => endGame(w, false, 'Неправильна відповідь'), 1100);
    }
  });
}

function endGame(missed, won, reason) {
  clearTimeout(gameTimer);
  const results = lsGet(GAME_RESULTS_KEY, []);
  const best = Math.max(0, ...results.filter(r => r.levels === game.key).map(r => r.score));
  const d = new Date(), date = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
  results.push({ nick: game.nick, levels: game.key, score: game.score, date });
  lsSet(GAME_RESULTS_KEY, results.slice(-500));
  const record = game.score > best && game.score > 0;
  if (record || won) soundFanfare();
  view = 'finish';
  $app.innerHTML = `<div class="finish">
    <div class="pic">${won ? '🏆' : record ? '🎉' : '⏱️'}</div>
    <h2 style="margin:0;font-size:28px">${won ? 'Усі слова вгадано!' : 'Гру закінчено'}</h2>
    <div class="sub">${esc(game.nick)} · рівні ${esc(game.key)}</div>
    <div class="panel"><div class="stats" style="grid-template-columns:1fr 1fr"><div><b>${game.score}</b><small>правильних слів</small></div><div><b>${Math.max(best, game.score)}</b><small>рекорд рівнів</small></div></div></div>
    ${record ? '<div class="toast">Новий рекорд для цих рівнів!</div>' : ''}
    ${missed ? `<div class="panel" style="text-align:left">${esc(reason)}. Правильно: <b class="es">${esc(missed.es)}</b> — ${esc(missed.ua)}</div>` : ''}
    <button class="cta" id="again">Грати ще</button>
    <button class="cta ghost" id="home">До таблиці результатів</button></div>`;
  document.getElementById('again').onclick = () => startGame(game.nick, game.levels);
  document.getElementById('home').onclick = () => { game = null; renderHome(); };
}


if (STANDALONE) {
  let saved = '';
  try { saved = localStorage.getItem(CURRENT_KEY) || ''; } catch (e) {}
  if (saved) { useProfile(saved); renderHome(); } else renderLogin();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
} else {
  loadLocal();
  renderHome();
  connectDb();
}

</script>
